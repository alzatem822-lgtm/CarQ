name: carq

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carq
      POSTGRES_PASSWORD: carq
      POSTGRES_DB: carq
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carq -d carq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # Servicios solo para pruebas de integración. Se levantan con:
  # docker compose --profile pruebas up -d db_pruebas redis_pruebas mqtt_pruebas
  # Sus datos viven en memoria: al apagarlos no queda nada.
  db_pruebas:
    profiles: ["pruebas"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carq
      POSTGRES_PASSWORD: carq
      POSTGRES_DB: carq_pruebas
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carq -d carq_pruebas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis_pruebas:
    profiles: ["pruebas"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

  mqtt_pruebas:
    profiles: ["pruebas"]
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1884:1883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "127.0.0.1",
          "-t",
          "carq/pruebas/salud",
          "-m",
          "ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  api:
    build: ./api
    init: true
    env_file: .env
    environment:
      PUERTO: "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt:
        condition: service_started
    ports:
      - "3001:3000"

  web:
    build: ./web
    init: true
    depends_on:
      - api
    ports:
      - "3000:3000"

  # OCR opcional: docker compose --profile ocr up -d --build lpr
  # La API lo alcanza mediante URL_LPR=http://lpr:8000.
  lpr:
    profiles: ["ocr"]
    build: ./lpr
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
