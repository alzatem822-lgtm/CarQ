name: carq

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carq
      POSTGRES_PASSWORD: carq
      POSTGRES_DB: carq
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carq -d carq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  api:
    build: ./api
    init: true
    env_file: .env
    environment:
      PUERTO: "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt:
        condition: service_started
    ports:
      - "3001:3000"

  web:
    build: ./web
    init: true
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Servicio de OCR. Solo se levanta con: docker compose --profile ocr up
  # La carpeta lpr/ se crea en el Sprint 2 (CARQ-84 en adelante).
  lpr:
    profiles: ["ocr"]
    build: ./lpr
    init: true
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data: