name: Arranque limpio

on:
  pull_request:
    branches: [main, develop]
    paths:
      - README.md
      - .env.example
      - docker-compose.yml
      - scripts/arrancar-local.mjs
      - scripts/verificar-arranque.mjs
      - .github/workflows/arranque-limpio.yml

jobs:
  verificacion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: carq-arranque-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ejecutar el comando del README en una copia limpia
        run: |
          test ! -e .env
          node scripts/arrancar-local.mjs
      - name: Comprobar el frontend y el inicio de sesión de ambos roles
        run: node scripts/verificar-arranque.mjs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
